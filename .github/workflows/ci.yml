name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/CiFailureCrew.Tests --no-build -c Release --verbosity normal

  # Builds the image the Action uses on Linux runners, without publishing it.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ci-failure-crew:ci .
      - name: Smoke test
        run: docker run --rm ci-failure-crew:ci --help

  # Calls the real OpenAI API, so it only runs on main and when the secret exists.
  integration:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Integration tests with OpenAI
        run: dotnet test tests/CiFailureCrew.IntegrationTests -c Release --verbosity normal
