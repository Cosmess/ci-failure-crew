name: Feature request
description: Suggest a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working. Examples of findings or configuration help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
